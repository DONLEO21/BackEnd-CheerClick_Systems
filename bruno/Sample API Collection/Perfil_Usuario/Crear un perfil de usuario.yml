info:
  name: Crear un perfil de usuario
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/perfilusuario
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "tipoDocumento": "Cédula de Ciudadanía",
        "numDocumento": "1184518712",
        "genero": "Femenino",
        "telefono": "3001234567",
        "fechaNacimiento": "2008-05-15",
        "eps": "Famisanar",
        "poliza": "poli.com",
        "fotoPerfil": "foto.png",
        "perteneceA": "6af34bb6be436e3f449a0d50",
        "ediciones": {"genero": 5}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
