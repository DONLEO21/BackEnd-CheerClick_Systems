info:
  name: Actualizar un perfil
  type: http
  seq: 5

http:
  method: PATCH
  url: http://localhost:3000/api/perfilUsuario/me
  headers:
    - name: X-Token
      value: "{{token}}"
  body:
    type: json
    data: |-
      {
        "telefono": "3000000000"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
