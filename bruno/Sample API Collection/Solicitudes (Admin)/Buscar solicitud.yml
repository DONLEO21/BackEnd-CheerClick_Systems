info:
  name: Buscar solicitud
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/api/usuarios/solicitudes?estado=Pendiente&buscar=Ivan
  params:
    - name: estado
      value: Pendiente
      type: query
    - name: buscar
      value: Ivan
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
